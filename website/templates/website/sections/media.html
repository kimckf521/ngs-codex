{% load static %}

<!-- CONTACT SECTION (exact 66vh) -->
<section style="margin:0; width:100%; height:66vh; overflow:hidden;">
  <div style="
        display:grid;
        grid-template-columns:50% 50%;
        width:100%;
        height:100%;  /* grid fills 66vh */
      ">

    <!-- Left: Contact Info -->
    <div style="
          background:#000;
          color:#fff;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          gap:24px;
          height:100%;   /* left column fills grid height */
          box-sizing:border-box;
          padding:40px;
        ">
      <!-- Logo -->
      <div style="
            font-size:120px;
            font-weight:900;
            background:linear-gradient(135deg,#00f0ff,#ff2ea1);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
          ">
        N
      </div>

      <!-- Title -->
      <h2 style="
            font-size:50px;
            font-weight:900;
            line-height:1.1;
            margin:0;
            text-align:center;
          ">
        GET IN<br>TOUCH<br>WITH US
      </h2>

      <!-- Email -->
      <p style="margin:0; font-size:18px;">info@nextgenscholars.asia</p>

      <!-- Social icons -->
      <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
        <a href="https://work.weixin.qq.com/kfid/kfc86f854c023857983">
          <img src="{% static 'img/media_icons/WeChat.png' %}" alt="WeChat"
               style="width:50px;height:50px;border-radius:8px;">
        </a>
        <a href="https://work.weixin.qq.com/kfid/kfc86f854c023857983">
          <img src="{% static 'img/media_icons/WeClass.png' %}" alt="视频号"
               style="width:50px;height:50px;border-radius:8px;">
        </a>
        <a href="https://xhslink.com/m/ARVy7jFyzLd">
          <img src="{% static 'img/media_icons/RedNote.png' %}" alt="小红书"
               style="width:50px;height:50px;border-radius:8px;">
        </a>
        <a href="https://www.linkedin.com/company/nextgenscholarsasia">
          <img src="{% static 'img/media_icons/LinkedIn.png' %}" alt="LinkedIn"
               style="width:50px;height:50px;border-radius:8px;">
        </a>
      </div>
    </div>

    <!-- Right: Graphic -->
    <div style="
          background:radial-gradient(circle at center,#3020ff 0%,#2b2a86 100%);
          display:flex;
          justify-content:center;
          align-items:center;
          height:100%;   /* right column fills grid height */
        ">
      <div style="position:relative;width:280px;height:280px;">
        <!-- Four blobs -->
        <div style="width:180px;height:180px;border-radius:50%;
                    background:radial-gradient(circle,#ff8dc1 0%,#c068ff 100%);
                    position:absolute;top:0;left:50px;opacity:.85"></div>
        <div style="width:180px;height:180px;border-radius:50%;
                    background:radial-gradient(circle,#ff8dc1 0%,#c068ff 100%);
                    position:absolute;bottom:0;left:50px;opacity:.85"></div>
        <div style="width:180px;height:180px;border-radius:50%;
                    background:radial-gradient(circle,#ff8dc1 0%,#c068ff 100%);
                    position:absolute;top:50px;left:0;opacity:.85"></div>
        <div style="width:180px;height:180px;border-radius:50%;
                    background:radial-gradient(circle,#ff8dc1 0%,#c068ff 100%);
                    position:absolute;top:50px;right:0;opacity:.85"></div>
        <!-- Center Label -->
        <div style="position:absolute;top:50%;left:50%;
                    transform:translate(-50%,-50%);
                    background:#fff;padding:10px 20px;border-radius:24px;
                    font-weight:900;color:#000;text-align:center">
          NextGen<br>Scholars
        </div>
      </div>
    </div>

  </div>
</section>
