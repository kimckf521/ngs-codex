{% load static %}

<section class="inprog">
  <div class="ip-card">
    <div class="ip-grid" 
         style="grid-template-columns:1.2fr 1fr;place-items:center;gap:40px;text-align:center">

      <!-- Left: Copy -->
      <div class="ip-copy" style="font-size:1.1em;max-width:600px;margin:auto">
        <span class="ip-badge">IN PROGRESS</span>
        <h1 class="ip-title" style="font-size:42px">We’re working on this page</h1>
        <p class="ip-lead" style="font-size:18px;line-height:1.7">
          Thanks for stopping by — this section is under active construction.
          We’re polishing content and wiring things up so it’s useful for you.
        </p>

        <!-- progress row -->
        <div class="ip-row" style="margin:12px auto;justify-content:center">
          <span class="ip-spinner" aria-hidden="true"></span>
          <div class="ip-bar" aria-hidden="true"><span></span></div>
        </div>
        <div class="ip-row" style="color:#6b7280;font-size:16px;margin-bottom:20px;justify-content:center">
          Live updates deploying soon
        </div>

        <!-- actions -->
        <div class="ip-row" style="margin-top:8px;gap:16px;justify-content:center">
          <a class="btn btn-primary" href="{% url 'index' %}">Go to Home</a>

          <!-- Contact Us as mailto -->
          <a class="btn btn-outline" 
             href="mailto:info@nextgenscholars.asia?subject=NGS%20Page%20Inquiry&body=Hello%20NGS%20team,"
             onclick="window.location.href=this.href;return false;">
            Contact Us
          </a>
        </div>
      </div>

      <!-- Right: Illustration -->
      <div class="ip-illust" aria-hidden="true" style="max-width:420px;margin:auto">
        <img src="{% static 'img/work_in_progress.jpg' %}" alt="" style="width:100%;height:auto;display:block;margin:auto">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
      </div>

    </div>
  </div>
</section>
