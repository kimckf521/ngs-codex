{% load static %}

<section style="
    width:100%;
    height:66vh;
    background:#fff;
    padding:40px 20px;
    box-sizing:border-box;
    overflow:hidden;"> <!-- clip anything accidental -->
<div style="
    max-width:980px; margin:0 auto; height:100%;
    display:flex; flex-direction:column;">
<!-- Title (compact spacing so there's room for the carousel) -->
<h2 class="section_title" style="font-weight:900; margin:0 0 16px; text-align:center;">
        Global Universities
    </h2>
<!-- Carousel row fills remaining height -->
<div class="carousel slide" id="carouseluni" style="flex:1; min-height:0;">
<div class="carousel-inner" style="height:100%;">
<div class="carousel-item active" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni1.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni2.jpeg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni3.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni4.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni5.jpeg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni6.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni7.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni8.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
<div class="carousel-item" style="height:100%;">
<img alt="" src="{% static 'img/inspires/uni9.jpg' %}" style="display:block; width:100%; height:100%; object-fit:cover; border-radius:10px;"/>
</div>
</div>
<!-- Controls (positioned within the same height, won't change layout) -->
<button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#carouseluni" type="button">
<span aria-hidden="true" class="carousel-control-prev-icon"></span>
<span class="visually-hidden">Previous</span>
</button>
<button class="carousel-control-next" data-bs-slide="next" data-bs-target="#carouseluni" type="button">
<span aria-hidden="true" class="carousel-control-next-icon"></span>
<span class="visually-hidden">Next</span>
</button>
</div>
</div>
</section>
