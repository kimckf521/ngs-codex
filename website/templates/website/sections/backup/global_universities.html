{% load static %}
<section class="section-font-style" style="width:100%;
                height:66vh;
                background:#fff;
                padding:40px 20px;
                box-sizing:border-box;
                overflow:hidden">
  <!-- clip anything accidental -->
  <div style="max-width:980px;
              margin:0 auto;
              height:100%;
              display:flex;
              flex-direction:column">
    <!-- Title (compact spacing so there's room for the carousel) -->
    <h2 style="font-size:32px;
               font-weight:900;
               margin:0 0 16px;
               text-align:center">Global Universities</h2>
    <!-- Carousel row fills remaining height -->
    <div id="carouseluni" class="carousel slide" style="flex:1; min-height:0;">
      <div class="carousel-inner" style="height:100%;">
        <div class="carousel-item active" style="height:100%;">
          <img src="{% static 'img/inspires/uni1.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni2.jpeg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni3.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni4.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni5.jpeg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni6.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni7.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni8.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
        <div class="carousel-item" style="height:100%;">
          <img src="{% static 'img/inspires/uni9.jpg' %}"
               alt=""
               style="display:block;
                      width:100%;
                      height:100%;
                      object-fit:cover;
                      border-radius:10px">
        </div>
      </div>
      <!-- Controls (positioned within the same height, won't change layout) -->
      <button class="carousel-control-prev"
              type="button"
              data-bs-target="#carouseluni"
              data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next"
              type="button"
              data-bs-target="#carouseluni"
              data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</section>
