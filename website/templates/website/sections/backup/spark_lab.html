{% load static %}
<section style="padding:60px 20px;
                background:linear-gradient(135deg,#f857a6,#ffcc70);
                width:100%;
                height:66vh;
                box-sizing:border-box">
  <div style="max-width:1180px;
              margin:auto;
              height:100%;
              display:flex;
              flex-direction:column">
    <!-- Title -->
    <h2 style="text-align:center;
               font-size:32px;
               font-weight:900;
               margin:0 0 16px">SPARK LAB</h2>
    <!-- Two-column layout -->
    <div style="flex:1;
                /* fill remaining height */ min-height:0;
                /* allow children to shrink inside 66vh */ display:grid;
                grid-template-columns:1.2fr 0.8fr;
                gap:20px;
                align-items:stretch">
      <!-- Left: Carousel (image resized to fit) -->
      <div id="carousellab"
           class="carousel slide"
           style="position:relative;
                  height:100%;
                  overflow:hidden">
        <div class="carousel-inner" style="height:100%;">
          <div class="carousel-item active" style="height:100%;">
            <img src="{% static 'img/inspires/lab1.png' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab2.jpg' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab3.png' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab4.png' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab5.png' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab6.jpg' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab7.jpg' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
          <div class="carousel-item" style="height:100%;">
            <img src="{% static 'img/inspires/lab8.jpg' %}"
                 alt=""
                 style="display:block;
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:8px">
          </div>
        </div>
        <!-- Controls overlay (don’t affect height) -->
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carousellab"
                data-bs-slide="prev"
                style="position:absolute;
                       top:50%;
                       transform:translateY(-50%)">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#carousellab"
                data-bs-slide="next"
                style="position:absolute;
                       top:50%;
                       transform:translateY(-50%)">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
      <!-- Right: Text (centered in column) -->
      <div style="display:flex;
                  align-items:center;
                  justify-content:center;
                  height:100%">
        <!-- parent column is full height -->
        <div style="text-align:left;
                    color:#000;
                    font-size:16px;
                    line-height:1.7;
                    background:#fff;
                    padding:20px;
                    border-radius:12px;
                    box-shadow:0 4px 12px rgba(0,0,0,.1)">
          <p style="margin:0;">
            <strong>NGS Global Network of Young Minds</strong>
          </p>
          <p style="margin:10px 0 0;">
            A collaborative platform for students worldwide to innovate, create, and inspire the future together.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
