<!-- Right: Form -->
<form class="ngs-form" method="POST" action="{% url 'partner_with_us' %}"
        style="border:1px solid #e4e4e4;
            border-radius:6px;
            overflow:hidden;
            background:#fff;
            display:flex;
            flex-direction:column;
            height:100%;"> <!-- ✅ form fills 66vh -->
    {% csrf_token %}

    <!-- Title bar -->
    <div style="background:#000;
                color:#fff;
                font-weight:900;
                padding:12px 16px;
                letter-spacing:.3px;">
    Looking to Partner with NGS
    </div>

    <!-- Fields -->
    <div style="display:grid; gap:12px; padding:16px; flex:1; overflow:auto;">
    <div>
        <label style="display:block; font-size:14px; color:#444;">Name</label>
        <input type="text" required placeholder="Your name"
            style="width:100%; padding:11px; border:1px solid #e0e0e0;
                    border-radius:4px; background:#f5f5f5;">
    </div>

    <div>
        <label style="display:block; font-size:14px; color:#444;">School</label>
        <input type="text" required placeholder="School / Organization"
            style="width:100%; padding:11px; border:1px solid #e0e0e0;
                    border-radius:4px; background:#f5f5f5;">
    </div>

    <div>
        <label style="display:block; font-size:14px; color:#444;">Email</label>
        <input type="email" required placeholder="you@example.com"
            style="width:100%; padding:11px; border:1px solid #e0e0e0;
                    border-radius:4px; background:#f5f5f5;">
    </div>

    <div>
        <label style="display:block; font-size:14px; color:#444;">Mobile / WeChat</label>
        <input type="text" placeholder="+61 … / your WeChat ID"
            style="width:100%; padding:11px; border:1px solid #e0e0e0;
                    border-radius:4px; background:#f5f5f5;">
    </div>

    <div style="flex:1; display:flex; flex-direction:column;">
        <label style="display:block; font-size:14px; color:#444;">Inquiries</label>
        <textarea rows="5" placeholder="Tell us a bit about your goals…"
                style="flex:1; width:100%; padding:11px; border:1px solid #e0e0e0;
                        border-radius:4px; background:#f5f5f5; resize:none;"></textarea>
    </div>
    </div>

    <!-- Submit Button -->
    <div style="padding:16px; border-top:1px solid #eee;">
    <button type="submit"
            style="width:100%; background:#111; color:#fff;
                    padding:14px 16px; border:0; border-radius:8px;
                    font-weight:800; font-size:16px; cursor:pointer;">
        Send
    </button>
    </div>
</form>
