{% load static %}

<!-- NEXTGEN GLOBAL COMMUNITY (2 columns, exact 66vh) -->
 
<section style="
  width:100%;
  height:66vh;                      /* fixed height */
  box-sizing:border-box;
  padding:32px 20px;
  background:linear-gradient(135deg,#7f4dff 0%,#45b7de 40%,#02a884 100%);
  overflow:hidden;                  /* clip any accidental spill */
  display:flex; align-items:center;">
  
  <div style="
    max-width:1280px; margin:0 auto; width:100%; height:100%;
    display:grid; grid-template-columns:1.2fr 1fr; gap:28px; align-items:center; min-height:0;">

    <!-- LEFT COLUMN: Title + Map + Locations -->
    <div style="
      height:100%; min-height:0;
      display:grid; grid-template-rows:auto 1fr auto; gap:12px; color:black; padding:20px 0;">

      <!-- Title -->
      <h2 style="
        margin:0;
        font-weight:900;
        line-height:1.05;
        letter-spacing:.3px;
        font-size:clamp(36px,6vw,50px);text-align:center;">
        NextGen Global Community
      </h2>

      <!-- Map (fills available space, never overflows) -->
      <div style="min-height:0; display:flex; align-items:center; justify-content:flex-start;">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/1200px-World_map_-_low_resolution.svg.png"
          alt="World Map"
          style="
            width:95%; height:90%;
            object-fit:contain;                   /* show whole map */
            filter:brightness(0) invert(1);">     <!-- white map -->
      </div>

      <!-- Locations -->
      <p style="
        margin:0; text-align:center;
        font-weight:600; line-height:1.45;
        font-size:clamp(14px,1.6vw,25px);">
        San Francisco · Melbourne<br>
        Hong Kong · Taiwan · Greater Bay Area China
      </p>
    </div>

    <!-- RIGHT COLUMN: Image -->
    <div style="height:100%; min-height:0; display:flex; align-items:center; justify-content:center;">
      <img
        src="{% static 'img/harvard.png' %}"
        alt="NGS Global Community"
        style="
          width:100%; height:100%;
          object-fit:cover;                       /* fills column cleanly */
          border-radius:16px;
          box-shadow:0 8px 24px rgba(0,0,0,.22);">
    </div>

  </div>
</section>

<!-- NEXTGEN GLOBAL COMMUNITY (66vh exact) -->
