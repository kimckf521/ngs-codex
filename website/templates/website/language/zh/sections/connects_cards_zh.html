{% load static %}

<section style="
    width:100%;
    min-height:66vh;
    background:linear-gradient(135deg,#d7b6ff 0%,#a9f1ff 35%,#b8ffcf 65%,#ffb3e6 100%);
    padding:40px 20px;
    box-sizing:border-box;
    display:flex; align-items:center;">
<div style="max-width:1180px;margin:auto;width:100%;height:100%;
                display:flex;flex-direction:column;text-align:center;">
<!-- Title -->
<h2 class="section_title" style="font-weight:900; margin:0 0 16px; color:#111; letter-spacing:.3px;">
        NextGen Connects
    </h2>
<!-- Subtle tagline -->
<p class="section_paragraph" style="margin:0 0 18px; color:#333; opacity:.85;">
        学校洞察 • 成长规划 • 学术准备 • 家庭决策
    </p>
<!-- Cards grid -->
<div style="
        flex:1; min-height:0;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
        gap:22px; align-items:stretch;">

<!-- Card -->
<div style="
        background:rgba(255,255,255,.75);
        border:1px solid rgba(0,0,0,.12);
        border-radius:18px;
        padding:18px;
        box-shadow:0 6px 18px rgba(0,0,0,.08);
        backdrop-filter:blur(6px);
        display:flex; flex-direction:column; align-items:center; text-align:center;">
<img alt="School Visits" src="{% static 'img/connects/vanke.JPG' %}" style="width:150px;height:150px;object-fit:cover;border-radius:50%;margin-bottom:12px;border:3px solid #fff;margin-bottom:10vh"/>
<h3 class="section_subtitle" style="font-weight:800; margin:0 0 8px; color:#111;">校园参访</h3>
<p class="section_paragraph" style="line-height:1.6; color:#333; margin:0;">
            顾问带领的校园参观，让家庭能亲身体验学校文化、教学与价值观。
        </p>
</div>

<!-- Card -->
<div style="
        background:rgba(255,255,255,.75);
        border:1px solid rgba(0,0,0,.12);
        border-radius:18px;
        padding:18px;
        box-shadow:0 6px 18px rgba(0,0,0,.08);
        backdrop-filter:blur(6px);
        display:flex; flex-direction:column; align-items:center; text-align:center;">
<img alt="School Reports" src="{% static 'img/connects/schoolreports.png' %}" style="width:150px;height:150px;object-fit:cover;border-radius:50%;margin-bottom:12px;border:3px solid #fff;margin-bottom:10vh"/>
<h3 class="section_subtitle" style="font-weight:800; margin:0 0 8px; color:#111;">学校报告</h3>
<p class="section_paragraph" style="line-height:1.6; color:#333; margin:0;">
            专家深度分析学校制度、领导力、师资与成绩记录，超越宣传册的表面信息。
        </p>
</div>

<!-- Card -->
<div style="
        background:rgba(255,255,255,.75);
        border:1px solid rgba(0,0,0,.12);
        border-radius:18px;
        padding:18px;
        box-shadow:0 6px 18px rgba(0,0,0,.08);
        backdrop-filter:blur(6px);
        display:flex; flex-direction:column; align-items:center; text-align:center;">
<img alt="Growth Mapping" src="{% static 'img/connects/growth.jpg' %}" style="width:150px;height:150px;object-fit:cover;border-radius:50%;margin-bottom:12px;border:3px solid #fff;margin-bottom:10vh"/>
<h3 class="section_subtitle" style="font-weight:800; margin:0 0 8px; color:#111;">成长规划</h3>
<p class="section_paragraph" style="line-height:1.6; color:#333; margin:0;">
            帮助学生匹配与其学术、社交及目标发展相契合的学校。
        </p>
</div>

<!-- Card -->
<div style="
        background:rgba(255,255,255,.75);
        border:1px solid rgba(0,0,0,.12);
        border-radius:18px;
        padding:18px;
        box-shadow:0 6px 18px rgba(0,0,0,.08);
        backdrop-filter:blur(6px);

<p class="section_paragraph" style="line-height:1.6; color:#333; margin:0;">
            帮助学生为国际课程做好核心技能与顺利过渡的准备。
        </p>
</div>
</div>

<!-- CTA -->
<div style="margin-top:18px;">
<a href="subscribe.html" style="display:inline-block;background:linear-gradient(90deg,#6a11cb,#2575fc);
                color:#fff;font-weight:800;padding:12px 28px;border-radius:40px;
                font-size:16px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.15);">
        立即订阅
        </a>
</div>
</div>
</section>
