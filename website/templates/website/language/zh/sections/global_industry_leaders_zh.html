{% load static %}
<section class="connect-to-schools__bg-white section-font-style_zh">
  <div class="connect-to-parents__flex-col">
    <!-- Title -->
    <h2 class="section_title connect-to-parents__text-center">NGS全球行业领袖</h2>
    <!-- Two-column layout -->
    <div class="connect-to-parents__grid-cols">
      <!-- Left: Carousel (image resized to fit) -->
      <div class="carousel slide connect-to-parents__relative"
           id="carouselleaders">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader1.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader2.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader3.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader4.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader5.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader6.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader7.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                   src="{% static 'img/inspires/leader8.jpg' %}"
                   class="connect-to-parents__rounded" />
            </div>
          </div>
        </div>
        <!-- Controls overlay (don’t affect height) -->
        <button class="carousel-control-prev connect-to-parents__absolute"
                data-bs-slide="prev"
                data-bs-target="#carouselleaders"
                type="button">
          <span aria-hidden="true" class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next connect-to-parents__absolute"
                data-bs-slide="next"
                data-bs-target="#carouselleaders"
                type="button">
          <span aria-hidden="true" class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
      <!-- Right: Text (centered in column) -->
      <div class="connect-to-parents__flex-center">
        <!-- parent column is full height -->
        <div class="connect-to-schools__flex-center">
          <p class="section_paragraph connect-to-schools__text-center">
            NGS与各行业创新与卓越的前沿领袖深度链接。通过邀请行业专家领袖作为线上研讨会主讲嘉宾、导师计划和职业发展工作坊, 学生可以深入了解新兴趋势、职业发展路径, 以及在竞争激烈的全球市场中取得成功所需的实际知识技能。
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
