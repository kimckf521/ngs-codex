{% load static %}
<section class="comprehensive__flex-center section-font-style">
  <div class="k12-school__flex-col">
    <!-- Title -->
    <h2 class="section_title comprehensive__text-center">全面且个性化的课程</h2>
    <!-- Content -->
    <div class="comprehensive__grid-cols">
      <!-- Left: Student image -->
      <div class="intro-hybrid__flex-center">
        <img alt="学生"
             src="{% static 'img/smilegirl.jpg' %}"
             class="comprehensive__rounded" />
      </div>
      <!-- Right: Text Content -->
      <div class="comprehensive__flex-col">
        <div class="comprehensive__style-1">
          <h3 class="section_subtitle comprehensive__style-2">个性化辅导</h3>
          <p class="section_paragraph comprehensive__style-3">
            拒绝千篇一律与“一刀切”课程。每位学生都是独一无二的学习者。
            <br>
            在 NGS，我们会进行入学测评、制定个性化学习计划、提供实时学习追踪，
            并定期反馈，帮助你在每一步都稳定进步。
          </p>
          <h3 class="section_subtitle comprehensive__style-2">明确的学习目标</h3>
          <p class="section_paragraph comprehensive__style-3">
            不论你的目标是提前预习、短期提分，还是冲刺备考，NGS 导师都会依据你的具体目标
            制定对应的学习方案。
          </p>
          <h3 class="section_subtitle comprehensive__style-2">覆盖热门学科</h3>
          <p class="section_paragraph comprehensive__style-4">NGS 提供 IB、A-Level、AP 与 IGCSE 多数学科的一对一辅导。</p>
        </div>
        <div class="comprehensive__text-center-c30c">
          <a href="{% url 'admissions' %}" class="comprehensive__bg-dark">预约试听课</a>
        </div>
      </div>
    </div>
  </div>
</section>
