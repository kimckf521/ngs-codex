{% load static %}
<section class="form-hybrid__section section-font-style">
  <div class="form-hybrid__flex-col">
    <!-- Title -->
    <h2 class="section_title form-hybrid__text-center">NGS 混合课程</h2>
    <!-- Content -->
    <div class="form-hybrid__grid-cols">
      <!-- Left: photo + tagline -->
      <div class="form-hybrid__flex-col-e0d5">
        <img alt="Student learning online"
             src="{% static 'img/smilegirl.jpg' %}"
             class="form-hybrid__rounded" />
        <p class="section_paragraph form-hybrid__style-1">
          享受随时随地学习的灵活性
          <br />
          以你自己的节奏学习
        </p>
      </div>
      <!-- Right: rounded table card -->
      <div class="form-hybrid__flex-col-cbed">
        <table class="form-hybrid__text-center-6228">
          <thead>
            <tr>
              <th class="form-hybrid__style-2">项目</th>
              <th class="form-hybrid__style-2">混合模式（Hybrid Model）</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="form-hybrid__style-3">课程选择</td>
              <td class="form-hybrid__style-3">A-Level / HKDSE / AP</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">入学评估</td>
              <td class="form-hybrid__style-3">线上</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">学科学习</td>
              <td class="form-hybrid__style-3">线上 + 校园</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">学习平台</td>
              <td class="form-hybrid__style-3">ClassIn + 课堂</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">学习社区</td>
              <td class="form-hybrid__style-3">SPARK LAB + 学校社区</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">形成性评估</td>
              <td class="form-hybrid__style-3">线上</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">官方评估</td>
              <td class="form-hybrid__style-3">校园</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">官方成绩单</td>
              <td class="form-hybrid__style-3">由学校颁发</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-4">注册入学</td>
              <td class="form-hybrid__style-4">NGS Online + 学校</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
