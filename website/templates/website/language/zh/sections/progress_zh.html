{% load static %}

<!-- IN PROGRESS (66vh, polished) -->
<section class="inprog progress__flex-center section-font-style_zh">
  <div class="ip-card progress__flex-col">
    <div class="ip-grid progress__grid-cols">
      <!-- allow children to shrink within 66vh -->
      <!-- Left: Copy -->
      <div class="ip-copy progress__flex-col-aba9 section-font-style_zh">
        <span class="progress__bg-dark"><h2>IN PROGRESS</h2></span>
        <h2 class="ip-title progress__style-9">此页面建设中</h2>
        <p class="">
          感谢您的访问 —— 本部分内容正在建设中。
          We’re polishing content and wiring things up so it’s useful for you.
        </p>
        <!-- progress row -->
        <div class="ip-row progress__flex-gap">
          <span aria-hidden="true" class="ip-spinner progress__circle"></span>
          <div aria-hidden="true" class="ip-bar progress__rounded">
            <span class="progress__bg-dark-1ca4"></span>
          </div>
        </div>
        <div class="ip-row progress__flex-center-a53f"><p>实时更新即将上线</p></div>
        <!-- actions -->
        <div class="ip-row progress__flex-gap-f4f1">
          <a class="btn btn-primary progress__bg-dark-71ff"
             href="{% url 'index_zh' %}">返回首页</a>
          <a class="btn btn-outline progress__bg-white"
             href="mailto:info@nextgenscholars.asia?subject=NGS%20Page%20Inquiry&amp;body=Hello%20NGS%20team,"
             onclick="window.location.href=this.href;return false;">联系我们</a>
        </div>
      </div>
      <!-- Right: Illustration -->
      <div aria-hidden="true" class="ip-illust progress__flex-center-5877">
        <!-- prevents overflow beyond 66vh -->
        <img alt=""
             src="{% static 'img/work_in_progress.jpg' %}"
             class="progress__style-11" />
        <span class="blob b1"></span>
        <span class="blob b2"></span>
      </div>
    </div>
  </div>
  <!-- tiny keyframes for the local spinner/bar (optional, safe inline) -->
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes load {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
    }
  </style>
</section>
