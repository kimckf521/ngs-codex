{% load static %}

<section style="
    height:66vh; 
    padding:40px 20px; 
    background:#fff; 
    width:100%; 
    box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;">
<div style="
    max-width:1180px; margin:auto; width:100%; 
    height:100%; 
    display:flex; flex-direction:column; justify-content:space-between; align-items:center; text-align:center;">
<!-- Title -->
<h2 class="section_title" style="font-weight:900; margin:0;">
        课程方案
    </h2>
<!-- Description -->
<p class="section_paragraph" style="max-width:780px; margin:0 auto; line-height:1.6; color:#444; flex:0;">
        课程内容紧密贴合考试大纲，系统覆盖 90% 的核心知识点。<br/>
        确保学生能够理解透彻、高效学习，并快速提升成绩。
    </p>
<!-- Image -->
<div style="flex:1; display:flex; align-items:center; justify-content:center; width:100%;">
<img alt="在线课堂" src="{% static 'img/studying.jpg' %}" style="max-width:60%; max-height:100%; width:auto; height:auto;
                    border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.1); object-fit:cover;"/>
</div>
<!-- Buttons -->
<div style="display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin-top:10px;">
<span style="background:linear-gradient(90deg,#2ecc71,#27ae60); color:#000; font-weight:700; padding:12px 22px; border-radius:40px; font-size:15px;">
        基础班
        </span>
<span style="background:linear-gradient(90deg,#56ccf2,#2f80ed); color:#000; font-weight:700; padding:12px 22px; border-radius:40px; font-size:15px;">
        同步班
        </span>
<span style="background:linear-gradient(90deg,#f2994a,#f2c94c); color:#000; font-weight:700; padding:12px 22px; border-radius:40px; font-size:15px;">
        强化班
        </span>
<span style="background:linear-gradient(90deg,#eb5757,#ff0080); color:#000; font-weight:700; padding:12px 22px; border-radius:40px; font-size:15px;">
        考前冲刺
        </span>
</div>
</div>
</section>
