{% load static %}

<section style="
    width:100%;
    height:66vh;
    background:linear-gradient(135deg,#d7b6ff 0%,#a9f1ff 35%,#b8ffcf 65%,#ffb3e6 100%);
    padding:40px 20px;
    box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;">
  <div style="max-width:1180px; margin:auto; width:100%; height:100%; display:flex; flex-direction:column;">

    <!-- Title -->
    <h2 class="section_title" style="text-align:center; font-weight:900; margin:0 0 12px;">
      全球升学申请
    </h2>

    <!-- Flags -->
    <div style="text-align:center; font-size:100px; margin:0 0 24px;">
      🇺🇸 🇬🇧 🇨🇦 🇦🇺 🇭🇰 🇸🇬
    </div>

    <!-- 4 Cards -->
    <div style="
        flex:1; 
        display:grid; 
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); 
        gap:20px; 
        height:100%;">

      <!-- Card 1 -->
      <div style="background:rgba(255,255,255,0.65); backdrop-filter:blur(4px);
                  border:1px solid rgba(0,0,0,.15); border-radius:20px;
                  padding:20px; display:flex; flex-direction:column; justify-content:flex-start;">
        <h3 class="section_subtitle" style="margin:0 0 12px; font-weight:900; line-height:1.3;">
          综合<br/>大学规划
        </h3>
        <ul style="margin:0; padding-left:18px; line-height:1.6; font-size:14px; color:#111;">
          <li>学业规</li>
          <li>选校清单</li>
          <li>个人陈述 / 简历写作</li>
          <li>推荐信</li>
          <li>面试辅导</li>
          <li>结识行业导师</li>
          <li>寻找同路社群</li>
        </ul>
      </div>

      <!-- Card 2 -->
      <div style="background:rgba(255,255,255,0.65); backdrop-filter:blur(4px);
                  border:1px solid rgba(0,0,0,.15); border-radius:20px;
                  padding:20px; display:flex; flex-direction:column; justify-content:flex-start;">
        <h3 class="section_subtitle" style="margin:0 0 12px; font-weight:900;">作品集<br/>准备</h3>
        <ul style="margin:0; padding-left:18px; line-height:1.6; font-size:14px; color:#111;">
          <li>视觉艺术作品集</li>
          <li>音乐作品集</li>
        </ul>
      </div>

      <!-- Card 3 -->
      <div style="background:rgba(255,255,255,0.65); backdrop-filter:blur(4px);
                  border:1px solid rgba(0,0,0,.15); border-radius:20px;
                  padding:20px; display:flex; flex-direction:column; justify-content:flex-start;">
        <h3 class="section_subtitle" style="margin:0 0 12px; font-weight:900;">考试准备</h3>
        <ul style="margin:0; padding-left:18px; line-height:1.6; font-size:14px; color:#111;">
          <li>SAT / IELTS 备考</li>
          <li>论文写作诊所</li>
          <li>学科辅导</li>
          <li>竞赛辅导</li>
        </ul>
      </div>

      <!-- Card 4 -->
      <div style="background:rgba(255,255,255,0.65); backdrop-filter:blur(4px);
                  border:1px solid rgba(0,0,0,.15); border-radius:20px;
                  padding:20px; display:flex; flex-direction:column; justify-content:flex-start;">
        <h3 class="section_subtitle" style="margin:0 0 12px; font-weight:900;">文凭（可选）</h3>
        <ul style="margin:0; padding-left:18px; line-height:1.6; font-size:14px; color:#111;">
          <li>远程学习</li>
          <li>混合式学习</li>
          <li>双轨学习</li>
          <li>校园考试</li>
          <li>高中毕业文凭</li>
        </ul>
      </div>

    </div>
  </div>
</section>
