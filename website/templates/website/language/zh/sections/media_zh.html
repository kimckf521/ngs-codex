{% load static %}

<!-- CONTACT SECTION (exact 66vh) -->
<section style="margin:0; width:100%; height:66vh; overflow:hidden; box-sizing:border-box;">
  <div style="
      display:grid; grid-template-columns:42% 58%;
      width:100%; height:100%; min-height:0;">

    <!-- LEFT: black contact panel -->
    <div style="
      background:#000; color:#fff;
      display:flex; flex-direction:column;
      height:100%; min-height:0;
      padding:2.8vh 3.2vh; box-sizing:border-box;">

      <!-- N logo (top-left) -->
      <img src="{% static 'img/big_n.png' %}" alt="NextGen Scholars Logo"
           style="height:15vh; width:15vh; display:block; ">

      <!-- Title (stacked, very large, left-aligned) -->
      <h1 style="
          margin:1vh 0 0;
          font-weight:900;
          line-height:1.02;
          letter-spacing:.02em;
          font-size:clamp(48px, 10.2vh, 80px);
          text-align:center;">
        请联系我们
      </h1>

      <!-- Email -->
      <p style="
          margin:1.4vh 0 0;
          font-size:clamp(14px, 2.4vh, 18px);
          font-weight:600;
          opacity:.95; text-align:center;">
        info@nextgenscholars.asia
      </p>

      <!-- Spacer pushes icon row toward the bottom but stays inside 66vh -->
      <div style="flex:1; min-height:0;"></div>

      <!-- Social / QR row -->
      <div style="
          display:flex;
          gap:2vh;                /* keep some breathing space */
          flex-wrap:wrap;
          align-items:flex-start;
          justify-content:space-between; /* ✅ evenly distribute items */
          width:100%;             /* stretch full width for spacing */
          box-sizing:border-box;
          padding: 0 30px;
      ">

        <!-- WeChat -->
        <div style="text-align:center; flex:1;">
          <a href="https://work.weixin.qq.com/kfid/kfc86f854c023857983" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/WeChat.png' %}" alt="WeChat"
                style="width:8vh; height:8vh; border-radius:1.2vh; display:block; margin:0 auto .6vh;">
          </a>
          <small style="display:block; font-size:clamp(10px,1.4vh,12px); color:#00e676;">@NextGenScholars</small>
        </div>

        <!-- WeChat Channels / 视频号 -->
        <div style="text-align:center; flex:1;">
          <a href="https://work.weixin.qq.com/kfid/kfc86f854c023857983" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/WeClass.png' %}" alt="视频号"
                style="width:8vh; height:8vh; border-radius:1.2vh; display:block; margin:0 auto .6vh;">
          </a>
          <small style="display:block; font-size:clamp(10px,1.4vh,12px); color:#00b0ff;">@视频号</small>
        </div>

        <!-- XiaoHongShu -->
        <div style="text-align:center; flex:1;">
          <a href="https://xhslink.com/m/FqQfX14laH" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/RedNote.png' %}" alt="小红书"
                style="width:8vh; height:8vh; border-radius:1.2vh; display:block; margin:0 auto .6vh;">
          </a>
          <small style="display:block; font-size:clamp(10px,1.4vh,12px); color:#ff3d57;">@小红书</small>
        </div>

        <!-- LinkedIn -->
        <div style="text-align:center; flex:1;">
          <a href="https://www.linkedin.com/company/nextgenscholarsasia" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/LinkedIn.png' %}" alt="LinkedIn"
                style="width:8vh; height:8vh; border-radius:1.2vh; display:block; margin:0 auto .6vh;">
          </a>
          <small style="display:block; font-size:clamp(10px,1.4vh,12px); color:#80d8ff;">@LinkedIn</small>
        </div>
      </div>

    </div>

    <!-- RIGHT: gradient + 4-petal graphic -->
    <div style="
      background:radial-gradient(120% 120% at 30% 15%, #2139ff 0%, #1f2e93 54%, #009881 100%);
      display:flex; align-items:center; justify-content:center;
      height:100%; min-height:0;">

      <!-- Petal group scales with viewport, never exceeds 66vh -->
      <div style="
          position:relative;
          width:min(60vmin, 620px);
          height:min(60vmin, 620px);">

        <!-- top petal -->
        <div style="
          position:absolute; top:0; left:50%; transform:translateX(-50%);
          width:72%; height:72%; border-radius:50%;
          background:radial-gradient(60% 60% at 50% 50%, rgba(255,172,189,.96), rgba(182,191,255,.32) 70%, rgba(182,191,255,0) 100%);"></div>

        <!-- bottom petal -->
        <div style="
          position:absolute; bottom:0; left:50%; transform:translateX(-50%);
          width:72%; height:72%; border-radius:50%;
          background:radial-gradient(60% 60% at 50% 50%, rgba(255,172,189,.96), rgba(182,191,255,.32) 70%, rgba(182,191,255,0) 100%);"></div>

        <!-- left petal -->
        <div style="
          position:absolute; top:50%; left:0; transform:translateY(-50%);
          width:72%; height:72%; border-radius:50%;
          background:radial-gradient(60% 60% at 50% 50%, rgba(255,172,189,.96), rgba(182,191,255,.32) 70%, rgba(182,191,255,0) 100%);"></div>

        <!-- right petal -->
        <div style="
          position:absolute; top:50%; right:0; transform:translateY(-50%);
          width:72%; height:72%; border-radius:50%;
          background:radial-gradient(60% 60% at 50% 50%, rgba(255,172,189,.96), rgba(182,191,255,.32) 70%, rgba(182,191,255,0) 100%);"></div>

        <!-- center pill -->
        <div style="
          position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
          background:#fff; color:#000; font-weight:900;
          border-radius:26px; padding:12px 22px;
          font-size:clamp(15px, 2.1vw, 22px); text-align:center;
          box-shadow:0 8px 22px rgba(0,0,0,.2);">
          NextGen<br>Scholars
        </div>
      </div>
    </div>

  </div>
</section>
