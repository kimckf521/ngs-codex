{% load static %}

<!-- CONTACT SECTION (exact 66vh) -->
<section class="media__section">
  <div class="media__grid-cols">

    <!-- LEFT: black contact panel -->
    <div class="media__flex-col">

      <!-- N logo (top-left) -->
      <img src="{% static 'img/big_n.png' %}" alt="NextGen Scholars Logo"
           class="media__style-1">

      <!-- Title (stacked, very large, left-aligned) -->
      <h1 class="media__text-center">
        请联系我们
      </h1>

      <!-- Email -->
      <p class="media__text-center-93a7">
        info@nextgenscholars.asia
      </p>

      <!-- Spacer pushes icon row toward the bottom but stays inside 66vh -->
      <div class="media__style-2"></div>

      <!-- Social / QR row -->
      <div class="media__flex-gap">

        <!-- WeChat -->
        <div class="media__text-center-e79f">
          <a href="https://work.weixin.qq.com/kfid/kfc86f854c023857983" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/WeChat.png' %}" alt="WeChat"
                class="media__rounded">
          </a>
          <small class="media__style-3">@NextGenScholars</small>
        </div>

        <!-- WeChat Channels / 视频号 -->
        <div class="media__text-center-e79f">
          <a href="https://work.weixin.qq.com/kfid/kfc86f854c023857983" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/WeClass.png' %}" alt="视频号"
                class="media__rounded">
          </a>
          <small class="media__style-4">@视频号</small>
        </div>

        <!-- XiaoHongShu -->
        <div class="media__text-center-e79f">
          <a href="https://xhslink.com/m/FqQfX14laH" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/RedNote.png' %}" alt="小红书"
                class="media__rounded">
          </a>
          <small class="media__style-5">@小红书</small>
        </div>

        <!-- LinkedIn -->
        <div class="media__text-center-e79f">
          <a href="https://www.linkedin.com/company/nextgenscholarsasia" target="_blank" rel="noopener">
            <img src="{% static 'img/media_icons/LinkedIn.png' %}" alt="LinkedIn"
                class="media__rounded">
          </a>
          <small class="media__style-6">@LinkedIn</small>
        </div>
      </div>

    </div>

    <!-- RIGHT: gradient + 4-petal graphic -->
    <div class="media__flex-center">

      <!-- Petal group scales with viewport, never exceeds 66vh -->
      <div class="media__relative">

        <!-- top petal -->
        <div class="media__radial-bg"></div>

        <!-- bottom petal -->
        <div class="media__radial-bg-aff0"></div>

        <!-- left petal -->
        <div class="media__radial-bg-b331"></div>

        <!-- right petal -->
        <div class="media__radial-bg-b67e"></div>

        <!-- center pill -->
        <div class="media__bg-white">
          NextGen<br>Scholars
        </div>
      </div>
    </div>

  </div>
</section>
