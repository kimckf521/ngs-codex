{% load static %}

<section class="global-universities__bg-white"> <!-- clip anything accidental -->
<div class="global-universities__flex-col">
<!-- Title (compact spacing so there's room for the carousel) -->
<h2 class="section_title global-universities__text-center">
        全球大学
    </h2>
<!-- Carousel row fills remaining height -->
<div class="carousel slide media__style-2" id="carouseluni">
<div class="carousel-inner index__style-9">
<div class="carousel-item active index__style-9">
<img alt="" src="{% static 'img/inspires/uni1.jpg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni2.jpeg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni3.jpg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni4.jpg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni5.jpeg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni6.jpg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni7.jpg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni8.jpg' %}" class="global-universities__rounded"/>
</div>
<div class="carousel-item index__style-9">
<img alt="" src="{% static 'img/inspires/uni9.jpg' %}" class="global-universities__rounded"/>
</div>
</div>
<!-- Controls (positioned within the same height, won't change layout) -->
<button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#carouseluni" type="button">
<span aria-hidden="true" class="carousel-control-prev-icon"></span>
<span class="visually-hidden">Previous</span>
</button>
<button class="carousel-control-next" data-bs-slide="next" data-bs-target="#carouseluni" type="button">
<span aria-hidden="true" class="carousel-control-next-icon"></span>
<span class="visually-hidden">Next</span>
</button>
</div>
</div>
</section>
