{% load static %}
<section class="global-universities__bg-white section-font-style_zh">
  <!-- clip anything accidental -->
  <div class="connect-to-parents__flex-col">
    <!-- Title (compact spacing so there's room for the carousel) -->
    <h2 class="section_title connect-to-parents__text-center">全球高校直连</h2>

        <!-- Two-column layout -->
    <div class="connect-to-parents__grid-cols">
      <!-- Left: Carousel (image resized to fit) -->
      <!-- Carousel row fills remaining height -->
      <div class="carousel slide connect-to-parents__relative" id="carouseluni">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni1.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni2.jpeg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni3.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni4.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni5.jpeg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni6.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni7.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni8.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
          <div class="carousel-item">
            <div class="carousel-media">
              <img alt=""
                  src="{% static 'img/inspires/uni9.jpg' %}"
                  class="global-universities__rounded" />
            </div>
          </div>
        </div>
        <!-- Controls (positioned within the same height, won't change layout) -->
        <button class="carousel-control-prev"
                data-bs-slide="prev"
                data-bs-target="#carouseluni"
                type="button">
          <span aria-hidden="true" class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next"
                data-bs-slide="next"
                data-bs-target="#carouseluni"
                type="button">
          <span aria-hidden="true" class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
      <!-- Right: Text (centered in column) -->
      <div class="connect-to-parents__flex-center">
        <!-- parent column is full height -->
        <div class="connect-to-parents__bg-white section-font-style_zh">
          <p class="section_paragraph connect-to-parents__style-1">
            <strong>NGS全球高校直连</strong>
          </p>
          <p class="section_paragraph connect-to-parents__style-2">NGS与世界知名大学建立长期合作联系,
为学生提供独家升学指导、
学校专业介绍、
校园参观以及众多交流拓展机会, 
助力他们迈向更广阔的未来。</p>
        </div>
      </div>
    </div>
    
  </div>
</section>
