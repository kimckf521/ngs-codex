<script src="{% static 'js/main.js' %}"></script>

<script>
    // Mobile menu functionality
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuToggle = document.getElementById("mobile-menu-toggle");
        const siteNav = document.getElementById("site-nav");
        const body = document.body;

        if (mobileMenuToggle) {
            mobileMenuToggle.addEventListener("click", function () {
                siteNav.classList.toggle("navbar__nav-open");
                mobileMenuToggle.classList.toggle("navbar__hamburger-active");
                body.classList.toggle("navbar__body-lock");
            });

            // Close menu when clicking on links
            const navLinks = siteNav.querySelectorAll("a");
            navLinks.forEach((link) => {
                link.addEventListener("click", function () {
                    siteNav.classList.remove("navbar__nav-open");
                    mobileMenuToggle.classList.remove("navbar__hamburger-active");
                    body.classList.remove("navbar__body-lock");
                });
            });
        }

        // Scroll behavior for navbar shadow
        window.addEventListener("scroll", function () {
            const header = document.querySelector("header");
            if (window.scrollY > 10) {
                header.classList.add("navbar__scrolled");
            } else {
                header.classList.remove("navbar__scrolled");
            }
        });
    });
</script>
