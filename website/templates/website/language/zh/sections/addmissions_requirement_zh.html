{% load static %}
<section class="addmissions-requirement__bg-white section-font-style">
  <div class="form-hybrid__flex-col">
    <!-- Title -->
    <h2 class="section_title addmissions-requirement__text-center">入学要求</h2>
    <!-- Content -->
    <div class="addmissions-requirement__grid-cols">
      <!-- Left: QR code -->
      <div class="addmissions-requirement__flex-col">
        <img alt="NGS 招生二维码"
             src="{% static 'img/wechatQR.png' %}"
             class="addmissions-requirement__style-1" />
        <p class="section_paragraph addmissions-requirement__text-center-5863">扫码了解 NGS 招生</p>
      </div>
      <!-- Right: Green table card -->
      <div class="addmissions-requirement__flex-col-fbdb">
        <table class="addmissions-requirement__text-center-2924">
          <thead>
            <tr>
              <th class="addmissions-requirement__style-2">项目</th>
              <th class="addmissions-requirement__style-2">详情</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="addmissions-requirement__style-3">学术要求</td>
              <td class="addmissions-requirement__style-3">初三毕业生</td>
            </tr>
            <tr>
              <td class="addmissions-requirement__style-3">年龄</td>
              <td class="addmissions-requirement__style-3">15 岁以上</td>
            </tr>
            <tr>
              <td class="addmissions-requirement__style-3">国籍</td>
              <td class="addmissions-requirement__style-3">不限</td>
            </tr>
            <tr>
              <td class="addmissions-requirement__style-3">语言</td>
              <td class="addmissions-requirement__style-3">英语水平 B1 以上</td>
            </tr>
            <tr>
              <td class="addmissions-requirement__style-3">居住地</td>
              <td class="addmissions-requirement__style-3">不限</td>
            </tr>
            <tr>
              <td class="addmissions-requirement__style-3">面试</td>
              <td class="addmissions-requirement__style-3">必需</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-4">硬件 / 软件要求</td>
              <td class="form-hybrid__style-4">台式机或笔记本电脑 / 已安装 ClassIn 应用</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
