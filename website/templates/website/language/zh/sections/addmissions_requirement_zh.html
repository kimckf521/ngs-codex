{% load static %}

<section style="height:66vh; padding:60px 20px; background:#fff; width:100%; box-sizing:border-box;">
<div style="max-width:1180px; margin:auto; height:100%; display:flex; flex-direction:column; justify-content:center;">
<!-- Title -->
<h2 class="section_title" style="text-align:center; font-weight:900; margin-bottom:30px;">
      入学要求
    </h2>
<!-- Content -->
<div style="flex:1; display:grid; grid-template-columns:1fr 2fr; gap:40px; height:100%; align-items:center; text-align:center;">
<!-- Left: QR code -->
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
<img alt="NGS 招生二维码" src="{% static 'img/wechatQR.png' %}" style="width:180px; height:180px; margin-bottom:10px; display:block;"/>
<p class="section_paragraph" style="color:#444; margin:0; text-align:center;">
          扫码了解 NGS 招生
        </p>
</div>
<!-- Right: Green table card -->
<div style="background:#2ecc71; color:#000; border-radius:20px; padding:20px;
                  display:flex; flex-direction:column; justify-content:center; height:100%; box-sizing:border-box;">
<table style="width:100%; border-collapse:collapse; font-size:14px; color:#000; text-align:center;">
<thead>
<tr>
<th style="padding:10px; border-bottom:1px solid #111;">项目</th>
<th style="padding:10px; border-bottom:1px solid #111;">详情</th>
</tr>
</thead>
<tbody>
<tr><td style="padding:8px; border-bottom:1px solid #111;">学术要求</td><td style="padding:8px; border-bottom:1px solid #111;">初三毕业生</td></tr>
<tr><td style="padding:8px; border-bottom:1px solid #111;">年龄</td><td style="padding:8px; border-bottom:1px solid #111;">15 岁以上</td></tr>
<tr><td style="padding:8px; border-bottom:1px solid #111;">国籍</td><td style="padding:8px; border-bottom:1px solid #111;">不限</td></tr>
<tr><td style="padding:8px; border-bottom:1px solid #111;">语言</td><td style="padding:8px; border-bottom:1px solid #111;">英语水平 B1 以上</td></tr>
<tr><td style="padding:8px; border-bottom:1px solid #111;">居住地</td><td style="padding:8px; border-bottom:1px solid #111;">不限</td></tr>
<tr><td style="padding:8px; border-bottom:1px solid #111;">面试</td><td style="padding:8px; border-bottom:1px solid #111;">必需</td></tr>
<tr><td style="padding:8px;">硬件 / 软件要求</td><td style="padding:8px;">台式机或笔记本电脑 / 已安装 ClassIn 应用</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</section>
