{% load static %}
<section class="form-hybrid__section section-font-style_zh">
  <div class="form-hybrid__flex-col">
    <!-- Title -->
    <h2 class="section_title form-hybrid__text-center">NGS 未来教育双轨计划</h2>
    <!-- Content -->
    <div class="form-hybrid__grid-cols">
      <!-- Left: photo + tagline -->
      <div class="form-hybrid__flex-col-e0d5">
        <img alt="Student learning online"
             src="{% static 'img/smilegirl.jpg' %}"
             class="form-hybrid__rounded" />
        <p class="section_paragraph form-hybrid__style-1">
          享受随时随地学习的灵活性
          <br />
          以你自己的节奏学习
        </p>
      </div>
      <!-- Right: rounded table card -->
      <div class="form-hybrid__flex-col-cbed">
        <table class="form-hybrid__text-center-6228">
          <thead>
            <tr>
              <th class="form-hybrid__style-2">分类</th>
              <th class="form-hybrid__style-2">未来教育双轨计划</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="form-hybrid__style-3">课程选择</td>
              <td class="form-hybrid__style-3">线上</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">入学测试</td>
              <td class="form-hybrid__style-3">线上+线下</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">学习方式</td>
              <td class="form-hybrid__style-3">ClassIn + 教室</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">学习平台</td>
              <td class="form-hybrid__style-3">SPARK LAB + 学校社区</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">学习社区</td>
              <td class="form-hybrid__style-3">线上</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">阶段评估</td>
              <td class="form-hybrid__style-3">线上+线下</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-3">考试局测试</td>
              <td class="form-hybrid__style-3">线下</td>
            </tr>
            <tr>
              <td class="form-hybrid__style-4">成绩单</td>
              <td class="form-hybrid__style-4">NGS线上学校、线下学校</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
