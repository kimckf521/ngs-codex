{% load static %}
<section class="index__section section-font-style">
  <div class="ngs-enquiry index__grid-cols-452f">
    <!-- ✅ grid fills 66vh -->
    <!-- Left: Image -->
    <div class="index__style-9">
      <img src="{% static 'img/studying.jpg' %}"
           alt="Online meeting"
           class="index__rounded">
    </div>
    <!-- Right: Form -->
    {% include "website/language/en/messages.html" %}
    <form class="ngs-form index__flex-col-621c"
          method="POST"
          action="{% url 'partner_with_us' %}">
      <!-- ✅ form fills 66vh -->
      {% csrf_token %}
      <!-- Title bar -->
      <div class="index__bg-dark"><h3>Looking to Partner with NGS</h3></div>
      <!-- Fields -->
      <div class="index__grid">
        <div>
          <label class="index__style-10 section-font-style"><p>Name</p></label>
          <input type="text"
                 name="name"
                 id="id_name"
                 required
                 placeholder="Your name"
                 class="index__rounded-7873">
        </div>
        <div>
          <label class="index__style-10 section-font-style"><p>School</p></label>
          <input type="text"
                 name="school_name"
                 id="id_school"
                 required
                 placeholder="School / Organization"
                 class="index__rounded-7873">
        </div>
        <div>
          <label class="index__style-10 section-font-style"><p>Email</p></label>
          <input type="email"
                 name="email"
                 id="id_email"
                 required
                 placeholder="you@example.com"
                 class="index__rounded-7873">
        </div>
        <div>
          <label class="index__style-10 section-font-style"><p>Mobile / WeChat</p></label>
          <input type="text"
                 name="mobile_or_wechat"
                 id="id_mobile_or_wechat"
                 placeholder="+61 … / your WeChat ID"
                 class="index__rounded-7873">
        </div>
        <div class="index__flex-col-d481">
          <label class="index__style-10 section-font-style"><p>Inquiries</p></label>
          <textarea rows="5"
                    name="help_description"
                    id="id_help_description"
                    placeholder="Tell us a bit about your goals…"
                    class="index__rounded-f54a"></textarea>
        </div>
      </div>
      <!-- Submit Button -->
      <div class="index__style-11">
        <button type="submit" class="index__bg-dark-d1b8">Send</button>
      </div>
    </form>
  </div>
</section>
