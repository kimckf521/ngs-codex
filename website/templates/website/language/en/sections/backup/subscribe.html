{% load static %}
<section class="section-font-style" style="width:100%;
                height:66vh;
                background:#fff;
                display:flex;
                align-items:center;
                justify-content:center;
                text-align:center;
                padding:0 20px;
                box-sizing:border-box">
  <div style="max-width:1000px; margin:auto;">
    <!-- Button -->
    <a href="subscribe.html"
       style="display:inline-block;
              background:linear-gradient(90deg,#00c6ff,#1de9b6);
              color:#fff;
              font-size:32px;
              /* larger font */ font-weight:900;
              padding:20px 50px;
              /* larger button size */ border-radius:50px;
              text-decoration:none;
              box-shadow:0 8px 20px rgba(0,0,0,.2);
              transition:transform .2s ease">Subscribe Today!</a>
    <!-- Tagline -->
    <p style="margin-top:28px;
              font-size:20px;
              color:#333;
              line-height:1.8;
              font-weight:600">Subscribe today and become a part of the NextGen Global Network!</p>
  </div>
</section>
